services:
  jekyll:
    image: ruby:3.2
    working_dir: /site
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - .:/site
      - bundle:/usr/local/bundle
    command: >
      sh -c "bundle config set path /usr/local/bundle &&
             bundle install &&
             bundle exec jekyll serve --host 0.0.0.0 --livereload"

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    # Dùng host network để admin gọi được Ollama trên host tại
    # http://localhost:11434 (Ollama mặc định chỉ lắng nghe loopback).
    network_mode: host
    command: ["uvicorn", "main:app", "--host", "127.0.0.1", "--port", "8000"]
    environment:
      REPO_DIR: /site
      PREVIEW_URL: http://localhost:4000
      SITE_URL: ${SITE_URL:-https://higiangcoder.github.io}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Nguyễn Trường Giang}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-HiGiangcoder@users.noreply.github.com}
    volumes:
      - .:/site
      - ~/.ssh:/host-ssh:ro
    depends_on:
      - jekyll

volumes:
  bundle:
