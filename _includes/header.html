<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} — về trang chủ">
      <span class="brand-mark" aria-hidden="true">G</span>
      <span class="brand-text">
        <strong>{{ site.title }}</strong>
        <small>{{ site.tagline }}</small>
      </span>
    </a>

    <nav class="site-nav" aria-label="Điều hướng chính">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Trang chủ</a>
      <a href="{{ '/bai-viet/' | relative_url }}"{% if page.url contains '/bai-viet' %} aria-current="page"{% endif %}>Bài viết</a>
      <a href="{{ '/chu-de/' | relative_url }}"{% if page.url contains '/chu-de' %} aria-current="page"{% endif %}>Chủ đề</a>
      <a href="{{ '/gioi-thieu/' | relative_url }}"{% if page.url == '/gioi-thieu/' %} aria-current="page"{% endif %}>Giới thiệu</a>

      <button class="theme-toggle" type="button" aria-label="Đổi chế độ sáng/tối" title="Đổi chế độ sáng/tối">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"></path>
        </svg>
      </button>
    </nav>
  </div>
</header>
