[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bloglint"
version = "0.1.0"
description = "Vietnamese blog writing diagnostics for a Jekyll blog"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
bloglint = "bloglint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bloglint = ["py.typed"]
