{% if files %}
<form class="panel stack" method="post" action="/publish" onsubmit="return handlePublishSubmit(this, event);">
  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr>
          <th style="width:2.5rem">
            <input type="checkbox" id="check-all" aria-label="Chọn tất cả">
          </th>
          <th>Trạng thái</th>
          <th>File</th>
        </tr>
      </thead>
      <tbody>
        {% for file in files %}
        <tr>
          <td><input class="file-check" type="checkbox" name="files" value="{{ file.path }}"></td>
          <td><code>{{ file.status }}</code></td>
          <td><code>{{ file.path }}</code></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <label>
    <span>Commit message</span>
    <input type="text" name="message" value="Cập nhật blog" required>
  </label>

  <label class="checkline">
    <input type="checkbox" name="commit_all" value="1">
    <span>Commit toàn bộ thay đổi (bỏ qua lựa chọn file ở trên)</span>
  </label>

  <p class="muted small">
    Chỉ các file được tick sẽ được đưa vào commit. File không tick sẽ không được commit.
  </p>

  <div class="form-actions">
    <button class="btn primary" type="submit" id="publish-submit">Commit &amp; Push</button>
    <a class="btn" href="/publish">Xem chi tiết →</a>
  </div>

  <div id="publish-result" class="publish-result" hidden>
    <span id="publish-status" class="save-status"></span>
    <a id="publish-detail-link" class="btn" href="#" target="_blank" rel="noopener" hidden>Xem chi tiết commit →</a>
  </div>
</form>

<script>
  window.handlePublishSubmit = function (form, event) {
    if (event) event.preventDefault();

    var button = document.getElementById("publish-submit");
    var status = document.getElementById("publish-status");
    var detail = document.getElementById("publish-detail-link");
    var resultBox = document.getElementById("publish-result");

    if (button) {
      button.disabled = true;
      button.innerHTML = '<span class="spinner"></span> Đang push...';
    }
    if (resultBox) resultBox.hidden = false;
    if (status) {
      status.textContent = "Đang commit và push...";
      status.className = "save-status pending";
    }
    if (detail) detail.hidden = true;

    fetch("/publish", {
      method: "POST",
      body: new FormData(form),
      headers: { "X-Requested-With": "XMLHttpRequest" }
    })
      .then(function (response) {
        return response.json().then(function (body) {
          if (!response.ok) throw new Error(body.detail || "Publish thất bại.");
          return body;
        });
      })
      .then(function (body) {
        if (status) {
          status.textContent = body.summary || (body.ok ? "Push thành công." : "Push thất bại.");
          status.className = "save-status " + (body.ok ? "ok" : "error");
        }
        if (detail && body.result_id) {
          detail.href = "/publish/result/" + body.result_id;
          detail.hidden = false;
        }
      })
      .catch(function (error) {
        if (status) {
          status.textContent = error.message || "Publish thất bại.";
          status.className = "save-status error";
        }
      })
      .finally(function () {
        if (button) {
          button.disabled = false;
          button.innerHTML = "Commit &amp; Push";
        }
      });

    return false;
  };
</script>

<script>
  (function () {
    var all = document.getElementById("check-all");
    var boxes = Array.prototype.slice.call(document.querySelectorAll(".file-check"));
    if (!all) return;
    all.addEventListener("change", function () {
      boxes.forEach(function (box) { box.checked = all.checked; });
    });
  })();
</script>
{% else %}
<p class="empty">Không có thay đổi nào để commit.</p>
{% endif %}
