---
layout: default
---

<article class="page">
  <header class="page-hero wrap wrap--narrow">
    {% if page.eyebrow %}
      <p class="eyebrow">{{ page.eyebrow }}</p>
    {% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p class="page-lede">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="post-body wrap wrap--narrow">
    {{ content }}
  </div>
</article>
